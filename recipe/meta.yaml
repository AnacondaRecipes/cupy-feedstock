{% set name = "cupy" %}
{% set version = "14.0.1" %}
{% set sha256 = "4b673ab2d8b2329abe7ae0a7ae6159656044a8eecca56cf0b834b7c907063205" %}
{% set number = 0 %}

{% set target_name = "x86_64-linux" %}  # [linux64]
{% set target_name = "ppc64le-linux" %}  # [ppc64le]
{% set target_name = "sbsa-linux" %}  # [aarch64]
{% set target_name = "x64" %}  # [win]

{% if cuda_compiler_version in (None, "None", True, False) %}
  {% set cuda_major = 0 %}
{% else %}
  {% set cuda_major = environ.get("cuda_compiler_version", "12.4").split(".")[0] | int %}
{% endif %}

# {{ PYTHON }} is not resolved properly in multi-output recipes...
{% set PYTHON = "python" %}
{% set PYTHON = "$PREFIX/bin/python" %}  # [linux]
{% set PYTHON = "%PREFIX%\\python" %}  # [win]


package:
  name: {{ name|lower }}-split
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: {{ sha256 }}

build:
  number: {{ number }}
  skip: true  # [(py<310) or osx]

requirements:
  host:
    - python

outputs:
  - name: cupy
    version: {{ version }}
    build:
      number: {{ number }}
    requirements:
      host:
        - python
        - cuda-version {{ cuda_compiler_version }}
      run:
        - python
        - {{ pin_subpackage('cupy-core', exact=True) }}
        - cuda-cudart-dev_{{ target_platform }}
        - cuda-nvrtc
        - libcublas
        - libcufft
        - libcurand
        - libcusolver
        - libcusparse
        # see discussions/references in conda-forge/cupy-feedstock#247
        - {{ pin_compatible("cuda-version", min_pin="x") }}
    test:
      requires:
        - pip
      commands:
        - pip check
    about:
      home: https://cupy.dev/
      license: MIT
      license_family: MIT
      license_file: LICENSE
      summary: |
        CuPy: NumPy & SciPy for GPU
      description: |
        CuPy is an open-source array library for GPU-accelerated computing with Python.
        It provides GPU versions of many NumPy and SciPy functions.
      dev_url: https://github.com/cupy/cupy/
      doc_url: https://docs.cupy.dev/en/stable/

  - name: cupy-core
    version: {{ version }}
    build:
      number: {{ number }}
      script_env:
        # To avoid memory usage warnings on CI, reduce parallelism of CuPy builds.
        - CUPY_NUM_BUILD_JOBS=1
      script:
        # CuPy default detects CUDA from nvcc, but on Conda-Forge's dockers nvcc lives in a different place...
        # With conda-forge/nvcc-feedstock#58, CUDA_PATH is set correctly
        - export NVCC="$(which nvcc)"                                                # [linux]
        - export CUDA_PATH=$PREFIX/targets/{{ target_name }}                         # [linux]
        - echo "nvcc is $NVCC, CUDA path is $CUDA_PATH"                              # [linux]
        - echo "CONDA_OVERRIDE_CUDA is $CONDA_OVERRIDE_CUDA"                         # [linux]
        - for /f "tokens=* usebackq" %%f in (`where nvcc`) do (set "dummy=%%f" && call set "NVCC=%%dummy:\=\\%%")  # [win64]
        # we use this WAR until we figure out how to proceed with conda-forge/nvcc-feedstock#88
        - set "NVCC=%NVCC% --use-local-env"                                          # [win64]
        # Point CUDA_PATH to conda env so CuPy finds the correct CUDA version
        # instead of a potentially mismatched system CUDA install.
        - set "CUDA_PATH=%PREFIX%\Library"                                           # [win64]
        - echo "nvcc is %NVCC%, CUDA path is %CUDA_PATH%"                            # [win64]
        - echo "CONDA_OVERRIDE_CUDA is %CONDA_OVERRIDE_CUDA%"                        # [win64]
        - >-
          {{ PYTHON }} -m pip install . --no-deps -vv
        - if errorlevel 1 exit 1  # [win]
        # enable CuPy's preload mechanism
        - mkdir -p "${SP_DIR}/cupy/.data/"                                                                          # [linux]
        - cp ${RECIPE_DIR}/preload_config/linux64_cuda{{ cuda_major }}_wheel.json ${SP_DIR}/cupy/.data/_wheel.json  # [linux]
        - if not exist %SP_DIR%\cupy\.data mkdir %SP_DIR%\cupy\.data                                                # [win]
        - copy %RECIPE_DIR%\preload_config\win64_cuda{{ cuda_major }}_wheel.json %SP_DIR%\cupy\.data\_wheel.json    # [win]
        # cupy/cupy#7578
        - if not exist %SP_DIR%\cupy\.data\_depends.json exit 1  # [win]
      missing_dso_whitelist:
        - '*/libcuda.*'  # [linux]
        - '*/nvcuda.dll'  # [win]
      ignore_run_exports_from:
        - {{ compiler('cuda') }}
        - cuda-driver-dev  # [linux]
        - cuda-cudart-dev
        - cuda-cudart-static
        - cuda-nvrtc-dev
        - cuda-nvtx-dev
        - cuda-profiler-api
        - libcublas-dev
        - libcufft-dev
        - libcurand-dev
        - libcusolver-dev
        - libcusparse-dev
      ignore_run_exports:
        # optional dependencies
        - nccl        # [linux]
        - cutensor
    requirements:
      build:
        - {{ compiler("c") }}
        - {{ stdlib("c") }}
        - {{ compiler("cxx") }}
        - {{ compiler("cuda") }}
      host:
        - python
        - pip
        - wheel
        - setuptools >=77
        - cython >=3.1,<3.2
        - numpy 2.*
        - cuda-version {{ cuda_compiler_version }}
        - cuda-driver-dev  # [linux]
        - cuda-cudart-dev
        - cuda-cudart-static
        - cuda-nvrtc-dev
        - cuda-nvtx-dev
        - cuda-profiler-api
        - libcublas-dev
        - libcufft-dev
        - libcurand-dev
        - libcusolver-dev
        - libcusparse-dev
        - nccl ~=2.17           # [linux]
        - cutensor ~=2.0
      run:
        - python
        - cuda-pathfinder >=1.3.3,<2.0a0
        - numpy >=2.0,<2.6
      run_constrained:
        # we move these here so that cupy-core can be installed in CPU-only envs
        - {{ pin_compatible("cuda-version", min_pin="x") }}
        - {{ pin_compatible('cuda-nvrtc', min_pin='x', max_pin='x') }}
        - {{ pin_compatible('libcublas', min_pin='x', max_pin='x') }}
        - {{ pin_compatible('libcufft', min_pin='x', max_pin='x') }}
        - {{ pin_compatible('libcurand', min_pin='x', max_pin='x') }}
        - {{ pin_compatible('libcusolver', min_pin='x', max_pin='x') }}
        - {{ pin_compatible('libcusparse', min_pin='x', max_pin='x') }}
        - scipy >=1.10,<1.17
        - optuna >=2.0
        - __cuda >={{ cuda_major }}.0
        - {{ pin_subpackage('cupy', max_pin='x.x') }}
        - {{ pin_compatible('nccl') }}                           # [linux]
        - {{ pin_compatible('cutensor') }}
    test:
      requires:
        - pip
      imports:
        - cupy  # dummy
      commands:
        - pip check
    about:
      home: https://cupy.dev/
      license: MIT
      license_family: MIT
      license_file: LICENSE
      summary: |
        CuPy: NumPy & SciPy for GPU
      description: |
        This is the CuPy core package without any dependencies on the CUDA libraries, suitable for
        deployment under resource constraint. You need to install the needed dependencies explicitly.
      dev_url: https://github.com/cupy/cupy/
      doc_url: https://docs.cupy.dev/en/stable/

about:
  home: https://cupy.dev/
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: |
    CuPy: NumPy & SciPy for GPU
  dev_url: https://github.com/cupy/cupy/
  doc_url: https://docs.cupy.dev/en/stable/

extra:
  recipe-maintainers:
    - jakirkham
    - leofang
    - kmaehashi
    - asi1024
    - emcastillo
    - toslunar

