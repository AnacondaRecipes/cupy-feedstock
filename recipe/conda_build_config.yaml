# CUDA 13 CCCL headers require vs2022; CUDA 12 uses vs2019
# Pattern follows ctranslate2-feedstock and llama.cpp-feedstock
c_compiler:                        # [win]
  - vs2019                         # [win]
  - vs2022                         # [win]
cxx_compiler:                      # [win]
  - vs2019                         # [win]
  - vs2022                         # [win]

# CUDA 12.4 is incompatible with GCC 14 (cuda-nvcc-impl requires gcc <13).
# CUDA 12.9+ supports gcc <15, compatible with GCC 14.3.0.
cuda_compiler_version:
  - 12.9                           # [win or linux]
  - 13.1                           # [win or linux]

zip_keys:                          # [win]
  -                                # [win]
    - cuda_compiler_version        # [win]
    - c_compiler                   # [win]
    - cxx_compiler                 # [win]
